<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to GitHub</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0d1117; /* GitHub dark background */
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  .container {
    text-align: center;
    padding: 50px 80px;
    background: #161b22; /* Slightly lighter card */
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    animation: fadeIn 1.5s ease-out forwards;
  }

  /* GitHub Logo SVG */
  .github-logo {
    width: 80px;
    margin-bottom: 30px;
    animation: dropIn 1s ease-out forwards;
    opacity: 0;
  }

  h1 {
    font-size: 3rem;
    color: #c9d1d9; /* GitHub light gray text */
    margin-bottom: 40px;
    animation: slideIn 1s ease-out 0.5s forwards;
    opacity: 0;
  }

  /* Animated button */
  button {
    padding: 12px 35px;
    font-size: 1rem;
    font-weight: bold;
    color: #0d1117;
    background: #f6f8fa; /* GitHub button style */
    border: none;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    animation: pulse 2s infinite;
    transition: all 0.3s ease;
  }

  button:hover {
    background: #c9d1d9;
  }

  /* Animations */
  @keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
  }

  @keyframes slideIn {
    from {opacity: 0; transform: translateY(-20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  @keyframes dropIn {
    from {opacity: 0; transform: translateY(-50px);}
    to {opacity: 1; transform: translateY(0);}
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.3);}
    50% { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.4);}
    100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.3);}
  }
</style>
</head>
<body>
  <div class="container">
    <!-- GitHub Logo SVG -->
    <svg class="github-logo" viewBox="0 0 16 16" fill="#c9d1d9" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 
      0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
      -.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
      0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 
      .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 
      1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>

    <h1>Welcome to GitHub</h1>
<a href="index.html">
        <button>Logout</button>
</a>
  </div>
</body>
</html>
