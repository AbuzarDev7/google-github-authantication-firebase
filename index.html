<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      flex-direction: column;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px 50px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }

    h2 {
      margin-bottom: 30px;
      color: #333;
    }

    button {
      width: 100%;
      padding: 12px 20px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    .google-btn {
      background: #4285F4;
      color: white;
    }

    .github-btn {
      background: #333;
      color: white;
    }

    button img {
      width: 24px;
      margin-right: 12px;
    }

    .google-btn:hover {
      background: #3367d6;
    }

    .github-btn:hover {
      background: #24292f;
    }

    #user-info {
      margin-top: 20px;
    }

    #user-info img {
      border-radius: 50%;
      margin-top: 10px;
    }
    </style>
</head>
<body>
    <h1>Login with google & github</h1>

 <div class="container">
    <h2>Sign In</h2>
    <button class="google-btn">
      <img src="https://img.icons8.com/color/48/000000/google-logo.png"/>
      Sign in with Google
    </button>
    <button class="github-btn">
      <img src="https://img.icons8.com/ios-glyphs/30/ffffff/github.png"/>
      Sign in with GitHub
    </button>
    <div id="user-info"></div>
  </div>


    <script type="module" src="app.js"></script>
</body>
</html>
